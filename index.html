<!-- Changelog
  v32 2026-10-15: Header cube removed (logo back in the banner); team name and record now sit above the league · season line.
  v31 2026-10-15: Logo moved from the banner to above the league · season line; team record shown as (W–L) beside the team name.
  v30 2026-10-15: Rules parser handles other rulebook layouts (Article/Section, decimal 1.1, ALL-CAPS or Markdown headings, bullets, (a)/(i) outlines); auto-built Contents with sections and topics; upload preview shows what was found.
  v29 2026-10-15: Rules tab reflows uploaded text (no hard line breaks), shows sections and outline levels with hanging labels, a section jump list, and in-browser search with highlighted matches.
  v28 2026-10-15: Header banner back to the green background (maroon-sided logo kept).
  v27 2026-10-15: Black header banner; maroon-sided logo (light outline) in the banner; icon links cache-busted so the new logo shows.
  v26 2026-10-15: Slim header banner on inside pages with the logo and full name; Exit / Sign out at its right.
  v25 2026-10-15: Chalk cube sides changed to maroon (top stays blue).
  v24 2026-10-15: Chalk cube logo: header mark, browser tab icon, home-screen icons and web app manifest.
  v23 2026-10-14: Finalize lineup. A final lineup (who's playing, pairings, game order) needs two confirmations to edit; locking a match finalizes it automatically.
  v22 2026-10-14: "Errors / game" column renamed EPG.
  v21 2026-10-14: Stats tables sort by any column (tap the heading; tap again to reverse). Players default to win % then name.
  v20 2026-10-14: Stats: "Errors / game" average replaces Error %.
  v19 2026-10-14: "Exit" replaces "Leave"; scratch pop-up shows each player's running count for the game and has "Log & add another" for repeat scratches.
  v18 2026-10-14: Current match heading reads Today's Match / Next Match / Last Match; full date on the card; Log scratch stays beside each match on phones.
  v17 2026-10-14: League admins can rename seasons.
  v16 2026-10-14: Multiple leagues, each with seasons (one current) and teams that carry over between seasons; rosters per team per season;
                  sign-in is League → Team → PIN; Owner / League admin / Team admin roles; rules per league.
  v15 2026-10-14: Admins sign in with real email addresses; "Forgot password?" sends a reset link by email; set-new-password screen.
  v14 2026-10-14: Moved to GitHub Pages + Supabase. League with many teams; team members sign in per session with team + 4-digit PIN;
                  league and team admins sign in with username + password; League tab for teams, PINs and admins; all permissions enforced by the database.
  v13 2026-10-14: Renamed app from Rack Sheet to The Scratch Sheet.
  v12 2026-10-14: Edit or correct a logged scratch (tap it, or the pencil) — change game, player or type, or delete it.
  v11 2026-10-14: Stats match tile shows upcoming match count instead of in-progress.
  v10 2026-10-14: Errors and Error % columns in the Stats players table (error = any scratch).
  v9 2026-10-14: Phone layout: bottom tab bar, larger tap targets, 16px inputs, bottom-sheet pop-ups.
  v8 2026-10-14: Log scratch button on each match in the Matches list.
  v7 2026-10-14: Scratch tracking. "Log scratch" on Current Match (game, player, type: table / pocket / off table / 8-ball); scratch log on match page; per-player scratch table on Stats.
  v6 2026-10-14: Current Match shows only today's match or the closest upcoming one; dropped "In progress" label there.
  v5 2026-10-14: Current Match section at the top of the Matches tab (today's match, else next upcoming, else latest unfinished).
  v4 2026-10-14: Standings tab renamed Stats; Rules tab pinned to the right.
  v3 2026-10-14: Applied OLS 8-Ball Doubles rules (10/7/2025): no repeat partners, everyone present must play, 4-player game-5 forfeit, <4 match forfeit, subs (not in playoffs, only when <5 present), FF/NP game results and match ties, 6–10 roster limits, PDF rules upload.
  v2 2026-10-14: Rules tab (post/overwrite league rules from .txt/.md/.docx/.html or pasted text); match lock with two-step unlock.
  v1 2026-10-14: Matches, pairings with rule check, results, comments, standings, team admin.
-->

<style>
/* Layout: one working column (max 880px) — header band, tabs, then a list → detail flow for matches */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --sunk:#e8ede6; --ink:#16211b; --muted:#5b6a61; --line:#d5ddd4;
  --cloth:#1d5c43; --cloth-ink:#ffffff; --chalk:#2a78b0;
  --win:#1d7a40; --win-bg:#e1f2e6; --loss:#b2362e; --loss-bg:#f8e3e0; --warn:#9a6a00; --warn-bg:#fbf0d3;
  --b1:#f2c12e; --b2:#2453b8; --b3:#cf2e2e; --b4:#6a3aa6; --b5:#ef7a1a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#15201a; --sunk:#101914; --ink:#e4ece6; --muted:#91a298; --line:#283830;
  --cloth:#4bb487; --cloth-ink:#06120c; --chalk:#68b0e3;
  --win:#5ccb8b; --win-bg:#173324; --loss:#f07e73; --loss-bg:#3a1c19; --warn:#f0c35a; --warn-bg:#352a10;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#15201a; --sunk:#101914; --ink:#e4ece6; --muted:#91a298; --line:#283830;
  --cloth:#4bb487; --cloth-ink:#06120c; --chalk:#68b0e3;
  --win:#5ccb8b; --win-bg:#173324; --loss:#f07e73; --loss-bg:#3a1c19; --warn:#f0c35a; --warn-bg:#352a10;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
.logo{display:block;flex:none}
.brand-id{display:flex;align-items:center;gap:14px}
.eyebrow .logo{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.gate{max-width:440px;margin:8px auto 0;width:100%}
.gate-seg{display:grid!important;grid-template-columns:1fr 1fr}
.gate-seg button{min-height:44px;font-size:14px}
.gate-seg button[aria-pressed="true"]{background:var(--cloth);color:var(--cloth-ink)}
input[type=password],input[type=email]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input.pin{font:600 22px/1 var(--f-mono);letter-spacing:.5em;text-align:center}
input.pin::placeholder{font:400 15px var(--f-body);letter-spacing:.02em}
#topbar{position:sticky;top:0;z-index:6;background:var(--cloth);color:var(--cloth-ink);padding-top:env(safe-area-inset-top,0px)}
#topbar .tb{max-width:880px;margin:0 auto;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#topbar .tb-id{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
#topbar .tb-id img{width:26px;height:26px;flex:none}
.eyebrow-below{margin:8px 0 0}
.h1-rec{font-weight:700;color:var(--muted);font-size:.62em;letter-spacing:.02em;white-space:nowrap;vertical-align:.08em}
#topbar .tb-name{font:800 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
#topbar .tb-right{display:flex;align-items:center;gap:10px;min-width:0}
#topbar .tb-who{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
#topbar .tb-exit{font:600 14px var(--f-body);color:inherit;background:transparent;border:1px solid currentColor;border-radius:8px;padding:6px 14px;min-height:36px;cursor:pointer;opacity:.95;white-space:nowrap}
#topbar .tb-exit:hover{opacity:1;background:rgba(255,255,255,.12)}
#topbar .tb-exit:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media (max-width:480px){#topbar .tb-who{display:none}}
.who-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who-chip b{color:var(--ink);font-weight:600;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
@media (max-width:640px){.lrow{grid-template-columns:1fr}.lrow .row{justify-content:flex-start}}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:16px 0}
.brand{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:800 clamp(30px,6vw,42px)/1 var(--f-display);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.record{font:600 14px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted)}
.record b{color:var(--ink)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.push{margin-left:auto}
nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--cloth)}
main{padding-block:20px 60px;display:grid;gap:20px}
h2{font:700 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0}
h3{font:600 15px var(--f-body);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--cloth);border-color:var(--cloth);color:var(--cloth-ink)}
.btn.danger{color:var(--loss)}
.btn.danger.armed{background:var(--loss);border-color:var(--loss);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
/* pool balls */
.ball{--b:var(--b1);width:34px;height:34px;border-radius:50%;background:var(--b);display:grid;place-items:center;flex:none;box-shadow:inset -3px -4px 0 rgba(0,0,0,.18)}
.ball span{width:18px;height:18px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:700 11px/1 var(--f-mono)}
.ball.g2{--b:var(--b2)}.ball.g3{--b:var(--b3)}.ball.g4{--b:var(--b4)}.ball.g5{--b:var(--b5)}
/* match list */
.mlist{display:grid;gap:8px}
.mcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.mcard:hover{border-color:var(--cloth)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.scr-btn{border-radius:var(--r)}
@media (max-width:480px){
  .mrow{gap:6px}
  .mcard{grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 12px}
  .mcard .mdate{grid-row:span 2}
  .mcard .pill{grid-column:2;justify-self:start}
  .scr-btn{width:74px;padding:6px 8px;font-size:13px;line-height:1.2;white-space:normal;text-align:center}
}
.mdate{font:500 12px/1.2 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:54px;text-align:center}
.mdate b{display:block;font:700 22px/1 var(--f-display);color:var(--ink)}
.mtitle{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pill{font:600 12px/1 var(--f-mono);padding:6px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.W{background:var(--win-bg);color:var(--win)}.pill.L{background:var(--loss-bg);color:var(--loss)}
.tag{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--chalk)}
/* roster chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500;user-select:none}
.chip input{accent-color:var(--cloth);margin:0}
.chip.on{border-color:var(--cloth);background:color-mix(in srgb,var(--cloth) 12%,var(--surface))}
/* games */
.games{display:grid;gap:10px}
.game{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg)}
.game.bad{border-color:var(--loss);box-shadow:inset 3px 0 0 var(--loss)}
.gmain{display:grid;gap:8px;min-width:0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.vs{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase}
.opp input{font-size:13px;padding:6px 9px}
.gside{display:grid;gap:6px;justify-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);font:700 13px var(--f-mono);padding:7px 11px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.W[aria-pressed="true"]{background:var(--win);color:#fff}
.seg button.L[aria-pressed="true"]{background:var(--loss);color:#fff}
.seg button.X[aria-pressed="true"]{background:var(--muted);color:var(--surface)}
.chip .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:15px;line-height:1}
.legend{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:4px}
.has-note{color:var(--chalk)}
.notes{display:grid;gap:6px;font-size:14px}
.notes div{padding:8px 12px;border-radius:8px}
.notes .e{background:var(--loss-bg);color:var(--loss)}
.notes .n{background:var(--warn-bg);color:var(--warn)}
.notes .ok{background:var(--win-bg);color:var(--win)}
.score{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.score b{font:800 40px/1 var(--f-display)}
.score .res{font:700 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.res.W{color:var(--win)}.res.L{color:var(--loss)}
.comment-preview{font-size:14px;white-space:pre-wrap;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th .sort{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;white-space:nowrap}
th .sort.on{color:var(--ink)}
th .sort:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* admin */
.season{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:12px;display:grid;gap:12px}
.season.current{border-color:var(--cloth)}
.plist{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.cur{border:1px solid var(--cloth);border-radius:var(--r);background:var(--surface);padding:16px;display:grid;gap:14px}
.cur-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.cur-games{display:grid;gap:6px}
.cur-game{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.cur-game .ball{width:26px;height:26px}.cur-game .ball span{width:14px;height:14px;font-size:9px}
.cur-game .who{min-width:0;overflow-wrap:anywhere}
.cur-game .opp{color:var(--muted);font-size:12px}
.cur-scr{display:flex;flex-wrap:wrap;gap:6px}
.scr{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;background:var(--bg)}
.scr b{font-weight:600}
.scr-edit{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0;text-align:left}
.scr-edit .pen{color:var(--chalk);margin-left:2px}
.scr-edit:hover b{text-decoration:underline}
.scr .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:inherit;width:100%}
.opt small{grid-column:2;color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--cloth);background:color-mix(in srgb,var(--cloth) 12%,var(--surface))}
.opt .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.opt[aria-pressed="true"] .dot{border-color:var(--cloth);background:var(--cloth)}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick button{border:2px solid transparent;border-radius:50%;padding:2px;background:none;cursor:pointer}
.gpick button[aria-pressed="true"]{border-color:var(--ink)}
.pill.T{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:36px 16px;display:grid;gap:12px;justify-items:center}
.empty p{max-width:44ch;margin:0;color:var(--muted)}
.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,12,8,.5);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--surface);border-radius:12px;padding:18px;width:min(520px,100%);display:grid;gap:12px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.ro .w{pointer-events:none;opacity:.6}
fieldset.lockable{border:0;margin:0;padding:0;min-width:0;display:grid;gap:20px}
fieldset.lockable:disabled .panel{opacity:.82}
fieldset.lockable:disabled .seg button[aria-pressed="true"]{opacity:1}
.lockbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.lockbar.on{border-color:var(--chalk);background:color-mix(in srgb,var(--chalk) 10%,var(--surface))}
.lockbar.warn{border-color:var(--loss);background:var(--loss-bg)}
.lockbar .msg{display:grid;gap:2px;min-width:0;flex:1 1 260px}
.lock-ico{display:inline-block;width:12px;height:10px;border:2px solid currentColor;border-radius:2px;position:relative;margin-right:6px;top:1px}
.lock-ico::before{content:"";position:absolute;left:1px;top:-8px;width:6px;height:6px;border:2px solid currentColor;border-bottom:0;border-radius:5px 5px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rules-search{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:2;background:var(--surface);padding-block:4px}

/* ---------- league rules (OLS 8-Ball Doubles, updated 10/7/2025) ----------
   II.A    roster 6–10 players per team
   III.A   5 games of doubles; every present player plays at least once
   III.A.1 / IV.A  nobody plays a 2nd game until every present player has played once
           (odd count: a repeat player may partner the last player who hasn't played)
   III.A.1 players arriving after everyone has played once are not eligible
   III.B   majority of five wins; if time runs out, games played decide (a 2–2 tie is possible)
   III.C.1 subs only when fewer than 5 players are present; no subs in playoffs
   III.F   exactly 4 present: play games 1–4, forfeit game 5; fewer than 4: match forfeit
   IV.A    a player can't have the same partner twice in a match

const MAX_ROSTER = 10, MIN_ROSTER = 6;
const isSub = (m, id) => (m.subs || []).some(s => s.id === id);
const slotsFor = n => n === 4 ? 4 : GAMES; // games that get players
function check(m) {

  const name = id => pName(m.seasonId, id, m);

  if (n === 4) notes.push("4 players present: play games 1–4 and forfeit game 5 (rule III.F).");

    .on("postgres_changes", { event: "*", schema: "public", table: "season_teams" }, reSeasons)
    .on("postgres_changes", { event: "*", schema: "public", table: "league_seasons", filter: `league_id=eq.${S.leagueId}` }, reSeasons)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "teams", filter: `id=eq.${teamId}` }, p => { if (!busy("config/team")) { S.team.name = p.new.name; render(); } })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "leagues", filter: `id=eq.${S.leagueId}` }, p => {
      S.league = { ...S.league, ...p.new }; S.team.activeSeasonId = p.new.current_season_id || "";
      if (!busy("config/rules")) S.rules = rulesFrom(p.new);
      render();
    })
    .subscribe();
  render();
}

/* ---------- sign-in ---------- */
async function refreshGate() {
  const [l, h] = await Promise.all([sb.rpc("list_leagues"), sb.rpc("league_has_admin")]);
  if (l.error) { S.gate.msg = "Can't reach the league server. Check your connection and reload."; S.leagues = []; }
  else S.leagues = l.data || [];
  S.hasLeague = !!h.data;
  const g = S.gate;
  if (!g.leagueId || !S.leagues.some(x => x.id === g.leagueId)) { try { g.leagueId = localStorage.getItem("ss-last-league") || ""; } catch (e) {} }
  if (!S.leagues.some(x => x.id === g.leagueId)) g.leagueId = S.leagues.length === 1 ? S.leagues[0].id : "";
  await refreshGateTeams();
}
async function refreshGateTeams() {
  const g = S.gate;
  if (!g.leagueId) { S.teams = []; return; }
  const { data } = await sb.rpc("list_signin_teams", { p_league: g.leagueId });
  S.teams = data || [];
  if (!S.teams.some(t => t.id === g.teamId)) { try { g.teamId = localStorage.getItem("ss-last-team") || ""; } catch (e) {} }
  if (!S.teams.some(t => t.id === g.teamId)) g.teamId = "";
}
async function showGate(msg) {
  S.phase = "gate"; S.gate.msg = msg || S.gate.msg || ""; S.leagues = null; render();
  await refreshGate();
  render();
}
// teams an admin can switch between (grouped by league)
async function loadAdminTeams() {
  const [t, l] = await Promise.all([sb.from("teams").select("id,name,league_id").order("name"), sb.from("leagues").select("id,name,current_season_id").order("name")]);
  S.adminTeams = t.data || []; S.adminLeagues = l.data || [];
}
async function afterAuth() {
  const { data, error } = await sb.rpc("whoami");
  if (error || !data?.uid) return signOut("Please sign in again.");
  S.username = data.admin?.username || ""; S.uid = data.uid;
  if (data.admin) {
    S.role = data.admin.role; S.adminLeague = data.admin.league_id || null; S.phase = "app";
    if (S.role === "team") return loadTeam(data.admin.team_id);
    await loadAdminTeams();
    let pick = null; try { pick = localStorage.getItem("ss-admin-team"); } catch (e) {}
    const team = S.adminTeams.find(t => t.id === pick) || S.adminTeams[0];
    S.mgr.leagueId = S.mgr.leagueId || S.adminLeague || team?.league_id || S.adminLeagues[0]?.id || null;
    if (team) return loadTeam(team.id);
    S.teamId = null; S.leagueId = S.mgr.leagueId; S.view.tab = "league";
    const lg = S.leagueId ? (await sb.from("leagues").select("rules_text,rules_file,rules_updated").eq("id", S.leagueId).maybeSingle()).data : null;
    S.rules = rulesFrom(lg); S.loaded = { team: true, seasons: true, matches: true, rules: true };
    return render();
  }
  if ((data.teams || []).length) { S.role = "member"; S.phase = "app"; if (S.view.tab === "admin" || S.view.tab === "league") S.view.tab = "matches"; return loadTeam(data.teams[0]); }
  return signOut();
}
async function signOut(msg) {
  try { if (S.role === "member") await sb.rpc("leave_team"); } catch (e) {}
  if (chan) { sb.removeChannel(chan); chan = null; }
  try { await sb.auth.signOut(); } catch (e) {}
  Object.assign(S, { role: null, username: "", adminLeague: null, teamId: null, leagueId: null, seasons: {}, matches: {}, team: { name: "", activeSeasonId: "" }, leagueAdmins: null, adminTeams: [], adminLeagues: [], mgr: { leagueId: null, data: null, seasonId: null } });
  S.view = { tab: "matches", matchId: null, seasonId: null }; S.ui.modal = null; renderLayer();
  return showGate(msg || "");
}

async function boot() {
  if (!window.supabase?.createClient) { $("#app").innerHTML = `<header><h1>The Scratch Sheet</h1></header><main><div class="panel empty"><p>Couldn't load. Check your connection and reload the page.</p></div></main>`; return; }
  const recovering = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { S.phase = "recovery"; S.gate.msg = ""; render(); } });
  const { data } = await sb.auth.getSession();
  if (location.hash.includes("access_token") || location.hash.includes("error")) {
    const err = new URLSearchParams(location.hash.slice(1)).get("error_description");
    history.replaceState(null, "", APP_URL);
    if (err) S.gate.msg = err.includes("expired") ? "That link has expired. Ask for a new one." : err;
  }
  if (recovering && data?.session) { S.phase = "recovery"; return render(); }
  if (data?.session) return afterAuth();
  return showGate();
}

/* ---------- render ---------- */
function render() {
  const act = document.activeElement, keep = act && act.id ? { id: act.id, val: act.value, s: act.selectionStart, e: act.selectionEnd, text: act.matches("input[type=text],input[type=search],textarea") } : null;
  const app = $("#app"), bar = $("#topbar");
  app.className = "wrap" + (S.canWrite ? "" : " ro");
  if (S.phase === "app") {
    const who = S.role === "member" ? "Team member" : `${esc(S.username)} · ${S.role === "owner" ? "Owner" : S.role === "league" ? "League admin" : "Team admin"}`;
    bar.innerHTML = `<div class="tb"><div class="tb-id"><img src="icons/logo.svg?v=27" alt=""><span class="tb-name">The Scratch Sheet</span></div><div class="tb-right"><span class="tb-who">${who}</span><button class="tb-exit" data-act="sign-out">${S.role === "member" ? "Exit" : "Sign out"}</button></div></div>`;
    bar.hidden = false;
  } else { bar.hidden = true; bar.innerHTML = ""; }
  if (S.phase !== "app") {
    app.innerHTML = `<header><div class="brand"><div class="brand-id"><img class="logo" src="icons/logo.svg?v=27" width="64" height="64" alt=""><div><div class="eyebrow">8-ball doubles league</div><h1>The Scratch Sheet</h1></div></div></div></header><main>${S.phase === "boot" ? "" : viewGate()}</main>`;
    if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.val; el.focus({ preventScroll: true }); } }
    return;
  }
  const ready = S.loaded.team && S.loaded.seasons && S.loaded.matches && S.loaded.rules;
  if (!ready) { app.innerHTML = `<header><h1>Loading…</h1></header>`; return; }
  const sid = curSeasonId(), s = S.seasons[sid];
  const rec = sid ? seasonMatches(sid).map(score).reduce((a, x) => (x.res && a[x.res]++, a), { W:0, L:0, T:0 }) : null;
  const seasons = seasonList();
  const tabs = [["matches","Matches"],["standings","Stats"]];
  if (isAdmin() && S.teamId) tabs.push(["admin","Team admin"]);
  if (isLeagueRole()) tabs.push(["league","League"]);
  tabs.push(["rules","Rules"]);
  if (!tabs.some(([k]) => k === S.view.tab)) S.view.tab = S.teamId ? "matches" : "league";
  app.innerHTML = `
  <header>
    <div class="brand">
      <div><h1>${esc(S.teamId ? (S.team.name || "Your team") : "No team yet")}${rec && S.teamId ? ` <span class="h1-rec" title="Match record this season">(${rec.W}–${rec.L}${rec.T ? "–" + rec.T : ""})</span>` : ""}</h1><div class="eyebrow eyebrow-below">${esc(S.league?.name || "League")}${s ? " · " + esc(s.name) : ""}</div></div>
      <div class="row">
        ${isLeagueRole() && S.adminTeams.length > 1 ? `<select id="team-pick" aria-label="Team" style="width:auto">${S.adminLeagues.map(l => { const ts = S.adminTeams.filter(t => t.league_id === l.id); return ts.length ? `<optgroup label="${esc(l.name)}">${ts.map(t => `<option value="${t.id}" ${t.id === S.teamId ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</optgroup>` : ""; }).join("")}</select>` : ""}
        ${seasons.length > 1 ? `<select id="season-pick" aria-label="Season" style="width:auto">${seasons.map(x => `<option value="${x.id}" ${x.id === sid ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>` : ""}
      </div>
    </div>
    <nav style="--n:${tabs.length}">${tabs.map(([k, l]) => `<button data-act="tab" data-v="${k}" aria-current="${S.view.tab === k}"${k === "rules" ? ' class="push"' : ""}>${l}</button>`).join("")}</nav>
  </header>
  <main>
    ${S.view.tab === "league" ? viewLeague() : S.view.tab === "rules" ? viewRules() : !S.teamId ? `<div class="panel empty"><p>Create a league and its first team on the League tab.</p></div>` : S.view.tab === "admin" ? viewAdmin() : S.view.tab === "rules" ? viewRules() : !s ? viewNoSeason() : S.view.tab === "standings" ? viewStandings(sid) : S.view.matchId && S.matches[S.view.matchId] ? viewMatch(S.view.matchId) : viewMatches(sid)}
  </main>`;
  renderLayer();
  if (keep) { const el = document.getElementById(keep.id); if (el) { if (keep.text) { el.value = keep.val; try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } el.focus({ preventScroll: true }); } }

function viewNoSeason() {
  if (!isLeagueRole()) return `<div class="panel empty"><h2>No season yet</h2><p>This team hasn't been added to a season yet. Your league admin does that on the League tab.</p></div>`;
  return `<div class="panel empty"><h2>No season yet</h2><p>This team isn't in any season. Add it to a season on the League tab, then build its roster under Team admin.</p><button class="btn primary w" data-act="tab" data-v="league">Open League tab</button></div>`;
  return `<div class="panel empty"><h2>Set up your team</h2><p>Name your team, add a season, and enter the players on the roster. Then come back here to build match lineups.</p><button class="btn primary w" data-act="tab" data-v="admin">Open team admin</button></div>`;
}

function currentMatches(list) {
  const today = todayISO(), byCreated = (a, b) => (a.created || 0) - (b.created || 0);
  const on = d => list.filter(m => m.date === d).sort(byCreated);
  const many = n => n > 1 ? "es" : "";
  if (on(today).length) return { title: `Today's Match${many(on(today).length)}`, ms: on(today) };
  const next = list.filter(m => m.date > today).map(m => m.date).sort()[0];
  if (next) return { title: `Next Match${many(on(next).length)}`, ms: on(next) };
  const last = list.filter(m => m.date && m.date < today).map(m => m.date).sort().pop();
  if (last) return { title: `Last Match${many(on(last).length)}`, ms: on(last) };
  return null;
}
function currentCard(m) {
  const sc = score(m), no = matchNo(m), n = (m.roster || []).length;
  const d = new Date((m.date || "") + "T12:00"), full = isNaN(d) ? "Date not set" : d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const games = m.games.map((g, i) => {
    const who = g.p.filter(Boolean).map(id => esc(pName(m.seasonId, id, m))).join(" &amp; ");
    const opp = (g.opp || []).filter(Boolean).map(esc).join(" &amp; ");
    const r = g.result, tag = r === "W" ? "W" : r === "L" || r === "FF" ? "L" : "";
    return `<div class="cur-game"><div class="ball g${i + 1}"><span>${i + 1}</span></div>
      <div class="who">${who || `<span class="muted">${g.result === "FF" ? "Forfeited" : "Not set"}</span>`}${opp ? `<div class="opp">vs ${opp}</div>` : ""}</div>
      ${r ? `<span class="pill ${tag}">${r === "FF" ? "Forfeit" : r === "NP" ? "Not played" : r}</span>` : `<span class="small muted">—</span>`}</div>`;
  }).join("");
  return `<div class="cur">
    <div class="cur-head">
      <div style="min-width:0"><div class="eyebrow">${esc(full)}${no.of > 1 ? ` · Doubleheader match ${no.n} of ${no.of}` : ""}${m.playoff ? " · Playoff" : ""}</div>
        <h2>vs ${esc(m.opponent || "Opponent TBD")}</h2>
        <div class="small muted">${n ? `${n} present` : "Nobody checked in yet"}${m.locked ? ' · <span class="tag"><span class="lock-ico" aria-hidden="true"></span>Locked</span>' : m.lineupFinal ? ' · <span class="tag">Lineup final</span>' : ""}</div></div>
      <div class="score"><b>${m.forfeit ? "FF" : sc.w + "–" + sc.l}</b>${sc.res ? `<span class="res ${sc.res}">${resLabel(sc.res)}</span>` : ""}</div>
    </div>
    <div class="cur-games">${games}</div>
    ${(m.scratches || []).length ? `<div class="cur-scr">${m.scratches.slice().reverse().map(x => `<span class="scr">${m.locked ? "" : `<button class="scr-edit w" data-act="edit-scratch" data-m="${m.id}" data-id="${x.id}" aria-label="Edit scratch">`}G${x.game + 1} · <b>${esc(pName(m.seasonId, x.player, m))}</b> · ${scrLabel(x.type)}${m.locked ? "" : ` <span class="pen" aria-hidden="true">✎</span></button><button class="x w" data-act="rm-scratch" data-m="${m.id}" data-id="${x.id}" aria-label="Remove scratch">×</button>`}</span>`).join("")}</div>` : ""}
    <div class="row"><button class="btn primary" data-act="open" data-id="${m.id}">${m.locked ? "View match" : m.games.some(g => g.p[0]) ? "Open match" : "Set lineup"}</button>
      <button class="btn w" data-act="scratch" data-m="${m.id}" ${m.locked || !(m.roster || []).length ? "disabled" : ""}>Log scratch</button>
      ${(m.scratches || []).length ? `<span class="small muted">${m.scratches.length} scratch${m.scratches.length === 1 ? "" : "es"} this match</span>` : ""}</div>
  </div>`;
}
function viewMatches(sid) {
  const list = seasonMatches(sid), cur = currentMatches(list);
  const cards = list.map(m => {
    const [mon, day, rest] = fmtDay(m.date), sc = score(m), no = matchNo(m);
    return `<div class="mrow"><button class="mcard" data-act="open" data-id="${m.id}">

        <div class="small muted">${esc(rest)}${no.of > 1 ? ` · <span class="tag">Doubleheader · match ${no.n}</span>` : ""}${m.comment ? " · has note" : ""}${m.locked ? ' · <span class="tag"><span class="lock-ico" aria-hidden="true"></span>Locked</span>' : ""}</div></div>

  }).join("");
  return `

  </section>
  <div class="row spread"><h2>Matches</h2><button class="btn primary w" data-act="new-match">New match</button></div>
  ${list.length ? `<div class="mlist">${cards}</div>` : `<div class="panel empty"><p>No matches yet this season. Add one to pick who's playing and draw the pairings.</p></div>`}`;
}

function viewMatch(id) {
  const m = S.matches[id], s = S.seasons[m.seasonId], sc = score(m), no = matchNo({ ...m, id });

  </section>

      : `<p class="muted small" style="margin:0">This season has no players yet. Add them in Team admin.</p>`}
    ${!LD && !m.playoff && roster.filter(id => !isSub(m, id)).length < 5 ? `<div class="prow"><input type="text" id="sub-name" class="w" placeholder="Sub name (registered player or league sub)" data-enter="add-sub"><button class="btn w" data-act="add-sub">Add sub</button></div><p class="small muted" style="margin:0">Fewer than 5 present, so a registered sub may play (rule III.C.1).</p>` : ""}
  </section>

/* sortable tables: S.ui.sort[table] = { k, dir } */
function sortRows(table, rows, cols, def) {
  const st = (S.ui.sort ||= {})[table] || def, col = cols[st.k] || cols[def.k];
  const name = r => (r._name || "").toLowerCase();
  const val = r => col.v(r);
  return rows.slice().sort((a, b) => {
    const va = val(a), vb = val(b);
    let c = typeof va === "string" ? va.localeCompare(vb) : (va ?? -1) - (vb ?? -1);
    if (st.dir === "desc") c = -c;
    return c || name(a).localeCompare(name(b));
  });
}
function th(table, k, label, def, title) {
  const st = (S.ui.sort ||= {})[table] || def, on = st.k === k;
  return `<th${title ? ` title="${title}"` : ""} aria-sort="${on ? (st.dir === "asc" ? "ascending" : "descending") : "none"}"><button class="sort ${on ? "on" : ""}" data-act="sort" data-t="${table}" data-k="${k}">${label}${on ? (st.dir === "asc" ? " ▲" : " ▼") : ""}</button></th>`;
}

function scratchStats(sid, ms) {
  const s = S.seasons[sid], rows = {}, tot = { table: 0, pocket: 0, off: 0, eight: 0 };
  ms.forEach(m => (m.scratches || []).forEach(x => { const r = rows[x.player] ||= { table: 0, pocket: 0, off: 0, eight: 0 }; r[x.type]++; tot[x.type]++; }));
  const ids = [...new Set([...activePlayers(s).map(p => p.id), ...Object.keys(rows).filter(id => (s.players || []).some(p => p.id === id))])];
  const sum = r => r.table + r.pocket + r.off + r.eight, z = { table: 0, pocket: 0, off: 0, eight: 0 };
  const SD = { k: "total", dir: "desc" };
  const list = sortRows("scr", ids.map(id => ({ id, _name: pName(sid, id), ...(rows[id] || z) })), {
    name: { v: r => r._name.toLowerCase() }, table: { v: r => r.table }, pocket: { v: r => r.pocket }, off: { v: r => r.off }, eight: { v: r => r.eight }, total: { v: r => sum(r) },
  }, SD);
  return `<section class="panel"><h3>Scratches</h3>
    <div class="tbl"><table><thead><tr>${th("scr", "name", "Player", SD)}${th("scr", "table", "Table", SD, "Complete miss, bad hit, no rail")}${th("scr", "pocket", "Pocket", SD)}${th("scr", "off", "Off table", SD)}${th("scr", "eight", "8-ball", SD, "Scratch on the 8 or premature 8")}${th("scr", "total", "Total", SD)}</tr></thead><tbody>
    ${list.map(r => `<tr><td>${esc(pName(sid, r.id))}</td><td>${r.table}</td><td>${r.pocket}</td><td>${r.off}</td><td>${r.eight}</td><td><b>${sum(r)}</b></td></tr>`).join("") || `<tr><td colspan="6" class="muted">No players yet.</td></tr>`}
    ${list.length ? `<tr><td class="muted">Team total</td><td>${tot.table}</td><td>${tot.pocket}</td><td>${tot.off}</td><td>${tot.eight}</td><td><b>${sum(tot)}</b></td></tr>` : ""}
    </tbody></table></div>
    <p class="small muted" style="margin:0">Log scratches from the Current match card or a match page. Subs' scratches stay on the match but aren't counted here.</p>
  </section>`;
}

function viewStandings(sid) {
  const ms = seasonMatches(sid), s = S.seasons[sid];
  const stats = {};
  const row = id => stats[id] ||= { id, nights: 0, gp: 0, w: 0, l: 0, err: 0 };
  activePlayers(s).forEach(p => row(p.id));
  ms.forEach(m => {
    (m.roster || []).forEach(id => row(id).nights++);
    (m.scratches || []).forEach(x => row(x.player).err++);
    m.games.forEach(g => [...new Set(g.p.filter(Boolean))].forEach(id => { const r = row(id); if (g.result) { r.gp++; r[g.result === "W" ? "w" : "l"]++; } }));
  });
  const PD = { k: "win", dir: "desc" };
  const rows = sortRows("players", Object.values(stats).filter(r => (s.players || []).some(p => p.id === r.id)).map(r => ({ ...r, _name: pName(sid, r.id) })), {
    name: { v: r => r._name.toLowerCase() }, nights: { v: r => r.nights }, gp: { v: r => r.gp }, w: { v: r => r.w }, l: { v: r => r.l },
    win: { v: r => r.gp ? r.w / r.gp : null }, err: { v: r => r.err }, epg: { v: r => r.gp ? r.err / r.gp : null },
  }, PD);
  const res = ms.map(m => ({ m, sc: score(m) }));
  const W = res.filter(x => x.sc.res === "W").length, L = res.filter(x => x.sc.res === "L").length, T = res.filter(x => x.sc.res === "T").length;
  const gw = res.reduce((a, x) => a + x.sc.w, 0), gl = res.reduce((a, x) => a + x.sc.l, 0);
  return `
  <h2>Stats · ${esc(s.name)}</h2>
  <div class="grid2">
    <div class="panel"><div class="eyebrow">Matches</div><div class="score"><b>${W}–${L}${T ? "–" + T : ""}</b><span class="muted small">${T ? "W–L–T · " : ""}${(() => { const t = todayISO(), up = ms.filter(m => !score(m).res && (m.date || "") >= t).length; return up ? up + " upcoming" : ""; })()}</span></div></div>
    <div class="panel"><div class="eyebrow">Games</div><div class="score"><b>${gw}–${gl}</b><span class="muted small">${gw + gl ? Math.round(gw / (gw + gl) * 100) + "% won · breaks ties in league standings" : ""}</span></div></div>
  </div>
  <section class="panel"><h3>Players</h3>
    <div class="tbl"><table><thead><tr>${th("players", "name", "Player", PD)}${th("players", "nights", "Matches", PD)}${th("players", "gp", "Games", PD)}${th("players", "w", "W", PD)}${th("players", "l", "L", PD)}${th("players", "win", "Win %", PD)}${th("players", "err", "Errors", PD, "Scratches of any type")}${th("players", "epg", "EPG", PD, "Errors per game: average scratches per game played")}</tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(pName(sid, r.id))}</td><td>${r.nights}</td><td>${r.gp}</td><td>${r.w}</td><td>${r.l}</td><td>${r.gp ? Math.round(r.w / r.gp * 100) + "%" : "—"}</td><td>${r.err}</td><td>${r.gp ? (r.err / r.gp).toFixed(2) : "—"}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">No players yet.</td></tr>`}
    </tbody></table></div>
    <p class="small muted" style="margin:0">Matches counts nights a player was marked as playing. Games count only games with a recorded result. Errors are scratches of any type. EPG (errors per game) is the average number of errors per game played.</p>
  </section>
  ${scratchStats(sid, ms)}
  <section class="panel"><h3>Match results</h3>
    <div class="tbl"><table><thead><tr><th>Date</th><th>Opponent</th><th>Games</th><th>Result</th></tr></thead><tbody>
    ${res.map(({ m, sc }) => `<tr><td>${esc(m.date)}</td><td>${esc(m.opponent || "TBD")}</td><td>${m.forfeit ? "Forfeit" : sc.w + "–" + sc.l}</td><td><span class="pill ${sc.res}">${resLabel(sc.res) || "Open"}</span></td></tr>`).join("") || `<tr><td colspan="4" class="muted">No matches yet.</td></tr>`}
    </tbody></table></div>
  </section>`;
}

/* ---------- league tab (owner / league admin) ---------- */
async function loadMgr(leagueId) {
  if (!leagueId) { S.mgr.data = { seasons: [], teams: [], st: [], league: null }; return render(); }
  if (S.mgr.loading === leagueId) return; S.mgr.loading = leagueId;
  const [lg, ls, tm] = await Promise.all([
    sb.from("leagues").select("id,name,current_season_id").eq("id", leagueId).maybeSingle(),
    sb.from("league_seasons").select("id,name,created_at").eq("league_id", leagueId).order("created_at"),
    sb.from("teams").select("id,name,created_at").eq("league_id", leagueId).order("name"),
  ]);
  const ids = (ls.data || []).map(s => s.id);
  const st = ids.length ? (await sb.from("season_teams").select("season_id,team_id").in("season_id", ids)).data || [] : [];
  const { data: pins } = await sb.rpc("list_signin_teams", { p_league: leagueId });
  S.mgr.loading = null;
  if (S.mgr.leagueId !== leagueId) return;
  S.mgr.data = { league: lg.data, seasons: ls.data || [], teams: tm.data || [], st, nopin: new Set() };
  (pins || []).forEach(p => { if (!p.has_pin) S.mgr.data.nopin.add(p.id); });
  if (!S.mgr.seasonId || !ids.includes(S.mgr.seasonId)) S.mgr.seasonId = lg.data?.current_season_id || ids[ids.length - 1] || null;
  render();
}
async function loadAdmins() {
  if (S.loadingAdmins) return; S.loadingAdmins = true;
  const { data, error } = await sb.from("admins").select("user_id,username,role,league_id,team_id").order("username");
  S.loadingAdmins = false;
  if (error) { toast(errMsg(error)); S.leagueAdmins = []; } else S.leagueAdmins = data;
  render();
}
function viewLeague() {
  const lid = S.mgr.leagueId, d = S.mgr.data;
  if (lid && (!d || d.league?.id !== lid)) { loadMgr(lid); }
  if (!S.leagueAdmins) loadAdmins();

        </div>
        ${pinOpen ? `<div class="prow" style="grid-column:1/-1"><input type="password" id="tp-${t.id}" class="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="New 4-digit PIN"><button class="btn w primary" data-act="team-pin-save" data-id="${t.id}">Save PIN</button></div>` : ""}
      </div>`; };
  const admins = S.leagueAdmins;
  const roleLabel = a => a.role === "owner" ? "Owner · all leagues" : a.role === "league" ? "League admin · " + esc(lname(a.league_id)) : "Team admin · " + esc(tname(a.team_id));
  const roleOpts = sel => (owner ? `<option value="owner" ${sel === "owner" ? "selected" : ""}>Owner (all leagues)</option>` + leagues.map(l => `<option value="league:${l.id}" ${sel === "league:" + l.id ? "selected" : ""}>League admin · ${esc(l.name)}</option>`).join("") : "")
    + (S.adminTeams || []).filter(t => owner || t.league_id === S.adminLeague).map(t => `<option value="team:${t.id}" ${sel === "team:" + t.id ? "selected" : ""}>Team admin · ${esc(t.name)}${owner && leagues.length > 1 ? " (" + esc(lname(t.league_id)) + ")" : ""}</option>`).join("");
  const delL = S.ui.armed === "league-del-" + lid;
  return `

  </section>

  <section class="panel">
    <h3>Seasons</h3>
    ${d.seasons.slice().reverse().map(s => { const cur = s.id === d.league.current_season_id, a = S.ui.armed === "season-del-" + s.id, n = d.st.filter(x => x.season_id === s.id).length; return `
      <div class="lrow">
        <div style="min-width:0"><b>${esc(s.name)}</b>${cur ? ` <span class="tag">Current season</span>` : ""}<div class="small muted">${n} team${n === 1 ? "" : "s"}</div></div>
        <div class="row">
          ${s.id === sid ? "" : `<button class="btn small" data-act="season-view" data-id="${s.id}">Teams</button>`}
          <button class="btn small w" data-act="season-rename-open" data-id="${s.id}">Rename</button>
          ${cur ? "" : `<button class="btn small w" data-act="season-current" data-id="${s.id}">Make current</button>`}
          <button class="btn small danger w ${a ? "armed" : ""}" data-act="season-del" data-id="${s.id}">${a ? "Delete season, its rosters and matches?" : "Delete"}</button>
        </div>
        ${S.ui.renameSeason === s.id ? `<div class="prow" style="grid-column:1/-1"><input type="text" id="sr-${s.id}" value="${esc(s.name)}" data-enter="season-rename-save" data-id="${s.id}" aria-label="Season name"><button class="btn w primary" data-act="season-rename-save" data-id="${s.id}">Save name</button></div>` : ""}
      </div>`; }).join("") || `<p class="small muted" style="margin:0">No seasons yet.</p>`}
    <div class="grid2">
      <label class="f">New season<input type="text" id="ns-name" class="w" placeholder="e.g. Spring 2027"></label>
      <label class="f">Teams<select id="ns-carry" class="w"><option value="1">Bring teams from the current season</option><option value="">Start with no teams</option></select></label>
    </div>
    <div class="row"><button class="btn primary w" data-act="season-add">Add season</button><span class="small muted">The new season becomes current, so players see its teams when they sign in.</span></div>
  </section>

  <section class="panel">
    <h3>Teams in ${esc(season?.name || "this season")} <span class="muted small">${seasonTeams.length}</span></h3>
    ${season ? seasonTeams.map(t => teamRow(t, true)).join("") || `<p class="small muted" style="margin:0">No teams in this season yet.</p>` : `<p class="small muted" style="margin:0">Add a season first.</p>`}
    ${season ? `<div class="grid2">
      <label class="f">New team name<input type="text" id="nt-name" class="w" placeholder="e.g. Itchy &amp; Scratchy"></label>
      <label class="f">Team PIN<input type="password" id="nt-pin" class="pin w" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="4 digits"></label>
    </div>
    <div><button class="btn primary w" data-act="team-create">Add new team to ${esc(season.name)}</button></div>` : ""}
    ${others.length ? `<h3 style="margin-top:6px">Other teams in this league <span class="muted small">not in ${esc(season?.name || "this season")}</span></h3>${others.map(t => teamRow(t, false)).join("")}` : ""}
  </section>

  ${owner ? `<section class="panel"><div class="row spread"><span class="small muted">Deleting a league removes its seasons, teams, rosters and matches.</span><button class="btn danger w ${delL ? "armed" : ""}" data-act="league-del">${delL ? "Delete this league and everything in it?" : "Delete league"}</button></div></section>` : ""}`}

  ${owner ? `<section class="panel">
    <h3>New league</h3>
    <div class="grid2">
      <label class="f">League name<input type="text" id="nl-name" class="w" placeholder="e.g. OLS Tuesday 8-Ball"></label>
      <label class="f">First season<input type="text" id="nl-season" class="w" placeholder="e.g. Fall 2026"></label>
    </div>
    <div><button class="btn primary w" data-act="league-create">Create league</button></div>
  </section>` : ""}

  <section class="panel">
    <h3>Admins <span class="muted small">${admins ? admins.length : ""}</span></h3>
    ${!admins ? `<p class="small muted" style="margin:0">Loading admins…</p>` : admins.map(a => { const me = a.user_id === S.uid, rm = S.ui.armed === "adm-rm-" + a.user_id, rp = S.ui.pwFor === a.user_id; const sel = a.role === "owner" ? "owner" : a.role === "league" ? "league:" + a.league_id : "team:" + a.team_id; return `
      <div class="lrow">
        <div style="min-width:0"><b class="em">${esc(a.username)}</b>${me ? ` <span class="tag">You</span>` : ""}<div class="small muted">${roleLabel(a)}</div></div>
        ${me ? "" : `<div class="row">
          <select class="w" data-act="adm-role" data-id="${a.user_id}" aria-label="Role for ${esc(a.username)}" style="width:auto">${roleOpts(sel)}</select>
          <button class="btn small w" data-act="adm-pw-open" data-id="${a.user_id}">Reset password</button>
          <button class="btn small danger w ${rm ? "armed" : ""}" data-act="adm-rm" data-id="${a.user_id}">${rm ? "Remove admin?" : "Remove"}</button>
        </div>`}
        ${rp ? `<div class="prow" style="grid-column:1/-1"><input type="text" id="pw-${a.user_id}" autocomplete="off" placeholder="New password (8+ characters)"><button class="btn w primary" data-act="adm-pw-save" data-id="${a.user_id}">Save password</button></div>` : ""}
      </div>`; }).join("")}
    <h3 style="margin-top:6px">Add an admin</h3>
    <div class="grid2">
      <label class="f">Email<input type="email" id="na-user" class="w" autocapitalize="none" spellcheck="false" placeholder="name@example.com"></label>
      <label class="f">Temporary password<input type="text" id="na-pass" class="w" autocomplete="off" placeholder="8+ characters"></label>
      <label class="f">Role<select id="na-role" class="w"><option value="">Choose a role</option>${roleOpts("")}</select></label>
    </div>
    <div><button class="btn primary w" data-act="adm-add">Add admin</button></div>
    <p class="small muted" style="margin:0">Give the new admin their email and temporary password. They can change it under Your account, or use "Forgot password?" on the sign-in screen.</p>
  </section>

  ${viewAccount()}`;
}

/* ---------- sign-in & league actions ---------- */
async function gateAction(a, b) {
  const g = S.gate;
  const fail = m => { g.busy = false; g.ok = false; g.msg = m; render(); };
  if (a === "gate-tab") { g.tab = b.dataset.v; g.msg = ""; render(); return true; }
  if (a === "gate-join") {
    const team = $("#gate-team")?.value, pin = $("#gate-pin").value.trim();
    if (!g.leagueId) return fail("Choose your league.");
    if (!team) return fail("Choose your team.");
    if (!/^\d{4}$/.test(pin)) return fail("Enter the 4-digit team PIN.");
    g.busy = true; g.msg = ""; g.teamId = team; render();
    try { localStorage.setItem("ss-last-team", team); localStorage.setItem("ss-last-league", g.leagueId); } catch (e) {}
    let { data: ses } = await sb.auth.getSession();
    if (!ses?.session) {
      const r = await sb.auth.signInAnonymously();
      if (r.error) return fail(/anonymous/i.test(errMsg(r.error)) ? "Team sign-in isn't turned on yet. The owner needs to allow anonymous sign-ins in Supabase." : errMsg(r.error));
    }
    const { data, error } = await sb.rpc("join_team", { p_team: team, p_pin: pin });
    if (error) return fail(errMsg(error));
    if (data === "ok") { g.busy = false; g.msg = ""; return afterAuth(); }
    return fail({ wrong: "That PIN didn't match. Try again.", locked: "Too many wrong PINs. Wait 15 minutes and try again.", no_pin: "This team doesn't have a PIN yet. Ask your league admin to set one.", no_team: "That team no longer exists." }[data] || "Couldn't check the PIN.");
  }
  if (a === "gate-admin") {
    const u = $("#gate-user").value.trim().toLowerCase(), p = $("#gate-pass").value;
    if (!u || !p) return fail("Enter your email and password.");
    g.busy = true; g.msg = ""; render();
    await sb.auth.signOut().catch(() => {});
    const { error } = await sb.auth.signInWithPassword({ email: toEmail(u), password: p });
    if (error) return fail(/invalid/i.test(errMsg(error)) ? "Wrong email or password." : /confirm/i.test(errMsg(error)) ? "Confirm your email first. Check your inbox for the link from Supabase." : errMsg(error));
    let who = await sb.rpc("whoami");
    if (!who.data?.admin && !S.hasLeague) { const c = await sb.rpc("claim_owner", { p_username: u }); if (!c.error) { S.view.tab = "league"; who = await sb.rpc("whoami"); } }
    if (!who.data?.admin) { await sb.auth.signOut(); return fail("That account isn't an admin. Ask your league admin."); }
    g.busy = false; return afterAuth();
  }
  if (a === "gate-forgot") {
    const u = $("#gate-user").value.trim().toLowerCase();
    if (!EMAIL_RE.test(u)) return fail("Type your email above, then tap Forgot password.");
    g.busy = true; g.msg = ""; render();
    const { error } = await sb.auth.resetPasswordForEmail(u, { redirectTo: APP_URL });
    g.busy = false;
    if (error) return fail(/rate|seconds/i.test(errMsg(error)) ? "Too many reset emails. Wait a few minutes and try again." : errMsg(error));
    g.ok = true; g.msg = "If that email belongs to an admin, a reset link is on its way. Open it on this device."; render(); g.ok = false; return true;
  }
  if (a === "recover-save") {
    const p = $("#rc-pass").value, p2 = $("#rc-pass2").value;
    if (p.length < 8) return fail("Use a password with at least 8 characters.");
    if (p !== p2) return fail("The two passwords don't match.");
    g.busy = true; render();
    const { error } = await sb.auth.updateUser({ password: p });
    if (error) return fail(errMsg(error));
    g.busy = false; g.msg = ""; toast("Password saved"); return afterAuth();
  }
  if (a === "gate-setup") {
    const u = $("#su-user").value.trim().toLowerCase(), p = $("#su-pass").value, p2 = $("#su-pass2").value;
    if (!EMAIL_RE.test(u)) return fail("Enter a valid email address.");
    if (p.length < 8) return fail("Use a password with at least 8 characters.");
    if (p !== p2) return fail("The two passwords don't match.");
    g.busy = true; g.msg = ""; render();
    await sb.auth.signOut().catch(() => {});
    const r = await sb.auth.signUp({ email: toEmail(u), password: p });
    if (r.error) return fail(errMsg(r.error));
    if (!r.data.session) { g.tab = "admin"; return fail("Check your email and tap the confirmation link, then sign in here with the Admin tab. Your owner setup finishes on that first sign-in."); }
    const c = await sb.rpc("claim_owner", { p_username: u });
    if (c.error) { await sb.auth.signOut(); return fail(errMsg(c.error)); }
    g.busy = false; S.view.tab = "league"; return afterAuth();
  }
  return false;
}

async function refreshAdminData(lid) {
  S.mgr.loading = null; S.mgr.data = null; S.leagueAdmins = null;
  await loadAdminTeams();
  if (S.teamId && S.leagueId === lid) {
    const { data } = await sb.from("leagues").select("id,name,current_season_id,rules_text,rules_file,rules_updated").eq("id", lid).maybeSingle();
    if (data) { S.league = data; S.team.activeSeasonId = data.current_season_id || ""; S.view.seasonId = null; S.ui.openSeason = null; }
    await loadSeasons();
  }
  render();
}
async function leagueAction(a, b) {
  const id = b.dataset.id, lid = S.mgr.leagueId;
  const say = (error, ok) => { if (error) { toast(errMsg(error)); return false; } if (ok) toast(ok); return true; };
  if (a === "team-open") { try { localStorage.setItem("ss-admin-team", id); } catch (e) {} S.view.tab = "matches"; await loadTeam(id); return true; }
  if (a === "team-pin-open") { S.ui.pinFor = S.ui.pinFor === id ? null : id; render(); setTimeout(() => $("#tp-" + id)?.focus(), 0); return true; }
  if (a === "team-pin-save") {
    const pin = $("#tp-" + id).value.trim(); if (!/^\d{4}$/.test(pin)) { toast("The PIN must be exactly 4 digits."); return true; }
    const { error } = await sb.rpc("set_team_pin", { p_team: id, p_pin: pin });
    if (say(error, "PIN saved. Players on that team need the new PIN.")) { S.ui.pinFor = null; await refreshAdminData(lid); }
    return true;
  }
  if (a === "team-create") {
    const name = $("#nt-name").value.trim(), pin = $("#nt-pin").value.trim();
    if (!name) { toast("Give the team a name."); return true; }
    if (!/^\d{4}$/.test(pin)) { toast("The PIN must be exactly 4 digits."); return true; }
    const { data, error } = await sb.rpc("create_team", { p_league: lid, p_name: name, p_pin: pin, p_season: S.mgr.seasonId });
    if (!say(error, `Added ${name}`)) return true;
    await refreshAdminData(lid);
    if (!S.teamId) { try { localStorage.setItem("ss-admin-team", data); } catch (e) {} await loadTeam(data); S.view.tab = "league"; render(); }
    return true;
  }
  if (a === "team-in") { const { error } = await sb.from("season_teams").insert({ season_id: S.mgr.seasonId, team_id: id }); if (say(error, "Team added to the season")) await refreshAdminData(lid); return true; }
  if (a === "team-out") {
    if (S.ui.armed !== "team-out-" + id) { arm("team-out-" + id); return true; }
    S.ui.armed = null;
    const { error } = await sb.from("season_teams").delete().eq("season_id", S.mgr.seasonId).eq("team_id", id);
    if (say(error, "Removed from the season. The team and its history are kept.")) await refreshAdminData(lid);
    return true;
  }
  if (a === "team-del") {
    if (S.ui.armed !== "team-del-" + id) { arm("team-del-" + id); return true; }
    S.ui.armed = null;
    const { error } = await sb.from("teams").delete().eq("id", id);
    if (!say(error, "Team deleted")) return true;
    await refreshAdminData(lid);
    if (S.teamId === id) { const next = S.adminTeams[0]; if (next) await loadTeam(next.id); else { if (chan) { sb.removeChannel(chan); chan = null; } S.teamId = null; S.seasons = {}; S.matches = {}; render(); } }
    return true;
  }
  if (a === "season-rename-open") { S.ui.renameSeason = S.ui.renameSeason === id ? null : id; render(); setTimeout(() => { const el = $("#sr-" + id); if (el) { el.focus(); el.select(); } }, 0); return true; }
  if (a === "season-rename-save") {
    const name = ($("#sr-" + id)?.value || "").trim();
    if (!name) { toast("Give the season a name."); return true; }
    if (name.length > 60) { toast("Keep season names under 60 characters."); return true; }
    const { error } = await sb.from("league_seasons").update({ name }).eq("id", id);
    if (say(error, `Renamed to ${name}`)) { S.ui.renameSeason = null; await refreshAdminData(lid); }
    return true;
  }
  if (a === "season-view") { S.mgr.seasonId = id; render(); return true; }
  if (a === "season-current") { const { error } = await sb.from("leagues").update({ current_season_id: id }).eq("id", lid); if (say(error, "Current season changed")) { S.mgr.seasonId = id; await refreshAdminData(lid); } return true; }
  if (a === "season-del") {
    if (S.ui.armed !== "season-del-" + id) { arm("season-del-" + id); return true; }
    S.ui.armed = null;
    const { error } = await sb.from("league_seasons").delete().eq("id", id);
    if (!say(error, "Season deleted")) return true;
    // matches from that season stay with their teams but no longer have a season; remove them for a clean slate
    if (S.teamId && S.leagueId === lid) Object.entries(S.matches).forEach(([mid, m]) => { if (m.seasonId === id && !m.locked) { delete S.matches[mid]; persist("matches", mid); } });
    await refreshAdminData(lid); return true;
  }
  if (a === "season-add") {
    const name = $("#ns-name").value.trim(), carry = $("#ns-carry").value === "1";
    if (!name) { toast("Give the season a name, like Spring 2027."); return true; }
    const cur = S.mgr.data?.league?.current_season_id;
    const { data, error } = await sb.from("league_seasons").insert({ league_id: lid, name }).select("id").single();
    if (!say(error)) return true;
    if (carry && cur) {
      const teams = S.mgr.data.st.filter(x => x.season_id === cur).map(x => ({ season_id: data.id, team_id: x.team_id }));
      if (teams.length) { const r = await sb.from("season_teams").insert(teams); if (r.error) toast(errMsg(r.error)); }
    }
    const u = await sb.from("leagues").update({ current_season_id: data.id }).eq("id", lid);
    say(u.error, `${name} is now the current season`);
    S.mgr.seasonId = data.id; await refreshAdminData(lid); return true;
  }
  if (a === "league-create") {
    const name = $("#nl-name").value.trim(), season = $("#nl-season").value.trim();
    if (!name) { toast("Give the league a name."); return true; }
    if (!season) { toast("Name the league's first season, like Fall 2026."); return true; }
    const { data, error } = await sb.rpc("create_league", { p_name: name, p_season: season });
    if (!say(error, `Created ${name}`)) return true;
    S.mgr.leagueId = data; S.mgr.seasonId = null; await refreshAdminData(data); return true;
  }
  if (a === "league-del") {
    if (S.ui.armed !== "league-del-" + lid) { arm("league-del-" + lid); return true; }
    S.ui.armed = null;
    const { error } = await sb.from("leagues").delete().eq("id", lid);
    if (!say(error, "League deleted")) return true;
    await loadAdminTeams();
    S.mgr.leagueId = S.adminLeagues[0]?.id || null; S.mgr.seasonId = null;
    if (S.leagueId === lid) { const next = S.adminTeams[0]; if (next) await loadTeam(next.id); else { if (chan) { sb.removeChannel(chan); chan = null; } S.teamId = null; S.seasons = {}; S.matches = {}; } }
    await refreshAdminData(S.mgr.leagueId); return true;
  }
  if (a === "adm-pw-open") { S.ui.pwFor = S.ui.pwFor === id ? null : id; render(); setTimeout(() => $("#pw-" + id)?.focus(), 0); return true; }
  if (a === "adm-pw-save") {
    const p = $("#pw-" + id).value; if (p.length < 8) { toast("Passwords need at least 8 characters."); return true; }
    const { error } = await sb.rpc("reset_admin_password", { p_user: id, p_password: p });
    if (say(error, "Password reset. Share it with the admin.")) { S.ui.pwFor = null; render(); }
    return true;
  }
  if (a === "adm-rm") {
    if (S.ui.armed !== "adm-rm-" + id) { arm("adm-rm-" + id); return true; }
    S.ui.armed = null;
    const { error } = await sb.rpc("remove_admin", { p_user: id });
    if (say(error, "Admin removed")) { S.leagueAdmins = null; render(); }
