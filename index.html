  }
  if (a === "adm-add") {
    const u = $("#na-user").value.trim().toLowerCase(), p = $("#na-pass").value, role = $("#na-role").value;
    if (!EMAIL_RE.test(u)) { toast("Enter a valid email address."); return true; }
    if (p.length < 8) { toast("The temporary password needs at least 8 characters."); return true; }
    if (!role) { toast("Choose a role."); return true; }
    if ((S.leagueAdmins || []).some(x => x.username === u)) { toast("That email is already an admin."); return true; }
    const mem = {}; const tmp = window.supabase.createClient(SB_URL, SB_KEY, { auth: { storage: { getItem: k => mem[k] ?? null, setItem: (k, v) => { mem[k] = v; }, removeItem: k => { delete mem[k]; } }, persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "ss-new-admin" } });
    const r = await tmp.auth.signUp({ email: toEmail(u), password: p });
    if (r.error) { toast(/registered|exists/i.test(errMsg(r.error)) ? "That email already has an account." : errMsg(r.error)); return true; }
    if (!r.data.user?.id || !r.data.user.identities?.length) { toast("That email already has an account."); return true; }
    const [rl, ref] = role.split(":");
    const { error } = await sb.rpc("add_admin", { p_user: r.data.user.id, p_username: u, p_role: rl, p_league: rl === "league" ? ref : null, p_team: rl === "team" ? ref : null });
    if (say(error, `Added ${u}`)) { S.leagueAdmins = null; render(); }
    return true;
  }
  if (a === "my-pass") {
    const p = $("#my-pass").value; if (p.length < 8) { toast("Passwords need at least 8 characters."); return true; }
    const { error } = await sb.auth.updateUser({ password: p });
    toast(error ? errMsg(error) : "Password changed"); if (!error) $("#my-pass").value = "";
    return true;
  }
  return false;
}
async function changeAdminRole(sel) {
  const [rl, ref] = sel.value.split(":");
  const { error } = await sb.rpc("update_admin", { p_user: sel.dataset.id, p_role: rl, p_league: rl === "league" ? ref : null, p_team: rl === "team" ? ref : null });
  toast(error ? errMsg(error) : "Role updated");
  S.leagueAdmins = null; render();
}
let leagueNameTimer = null;
function saveLeagueName(v) {
  clearTimeout(leagueNameTimer);
  leagueNameTimer = setTimeout(async () => {
    const name = v.trim(); if (!name) return;
    const { error } = await sb.from("leagues").update({ name }).eq("id", S.mgr.leagueId);
    if (error) return toast(errMsg(error));
    if (S.mgr.data?.league) S.mgr.data.league.name = name;
    const l = (S.adminLeagues || []).find(x => x.id === S.mgr.leagueId); if (l) l.name = name;
    if (S.league && S.leagueId === S.mgr.leagueId) S.league.name = name;
  }, 600);
}

/* ---------- actions ---------- */
function editLineup(fn) { const m = S.matches[S.view.matchId]; if (m?.lineupFinal && !m.locked) { toast("The lineup is final. Tap Edit lineup to change it."); render(); return; } editMatch(fn); }
function editMatch(fn) { const id = S.view.matchId, m = S.matches[id]; if (!m) return; if (m.locked) { toast("This match is locked. Unlock it to make changes."); render(); return; } fn(m); persist("matches", id); render(); }
function editSeason(id, fn) { const s = S.seasons[id]; if (!s) return; fn(s); persist("seasons", id); render(); }
function arm(key) { if (S.ui.armed === key) return true; S.ui.armed = key; render(); clearTimeout(arm.t); arm.t = setTimeout(() => { if (S.ui.armed === key) { S.ui.armed = null; render(); } }, 4000); return false; }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.type === "checkbox") return;
  const a = b.dataset.act, g = +b.dataset.g;
  if (a.startsWith("gate-")) { gateAction(a, b); return; }
  if (a === "rules-q-clear") { S.ui.rulesQ = ""; const el = $("#rules-q"); if (el) { el.value = ""; el.focus(); } updateRulesResults(); return; }
  if (a === "toc-toggle") { e.preventDefault(); const d = $("#rules-toc"); S.ui.tocOpen = !d.open; d.open = S.ui.tocOpen; return; }
  if (a === "rules-jump") { document.getElementById(b.dataset.v)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); return; }
  if (a === "sort") {
    const t = b.dataset.t, k = b.dataset.k, cur = (S.ui.sort ||= {})[t];
    S.ui.sort[t] = cur && cur.k === k ? { k, dir: cur.dir === "asc" ? "desc" : "asc" } : { k, dir: k === "name" ? "asc" : "desc" };
    render(); return;
  }
  if (a === "sign-out") { signOut(); return; }
  if (/^(team-|adm-|my-pass$|season-(view|current|del|add|rename-open|rename-save)$|league-(create|del)$)/.test(a)) { if (a === "my-pass" || isLeagueRole()) leagueAction(a, b); return; }
  if (a === "pin-set") {
    const pin = $("#new-pin").value.trim(); if (!/^\d{4}$/.test(pin)) { toast("The PIN must be exactly 4 digits."); return; }
    if (S.ui.armed !== "pin-set") { arm("pin-set"); setTimeout(() => { const el = $("#new-pin"); if (el) el.value = pin; }, 0); return; }
    S.ui.armed = null;
    sb.rpc("set_team_pin", { p_team: S.teamId, p_pin: pin }).then(({ error }) => { toast(error ? errMsg(error) : "PIN changed. Share the new PIN with your team."); render(); });
    return;
  }
  if (a === "scratch") { const m = S.matches[b.dataset.m]; if (!m || m.locked) return; S.ui.modal = { kind: "scratch", matchId: b.dataset.m, game: defaultGame(m), player: "", type: "" }; renderLayer(); return; }
  if (a === "scr-game") { S.ui.modal.game = +b.dataset.v; renderLayer(); return; }
  if (a === "scr-player") { S.ui.modal.player = b.dataset.v; renderLayer(); return; }
  if (a === "scr-type") { S.ui.modal.type = b.dataset.v; renderLayer(); return; }
  if (a === "edit-scratch") { const m = S.matches[b.dataset.m], x = (m?.scratches || []).find(y => y.id === b.dataset.id); if (!x || m.locked) return; S.ui.armed = null; S.ui.modal = { kind: "scratch", matchId: b.dataset.m, editId: x.id, game: x.game, player: x.player, type: x.type }; renderLayer(); return; }
  if (a === "scr-del") {
    const md = S.ui.modal, m = S.matches[md.matchId]; if (!m || m.locked || !S.canWrite) return;
    if (S.ui.armed !== "scr-del") { S.ui.armed = "scr-del"; renderLayer(); return; }
    S.ui.armed = null; m.scratches = (m.scratches || []).filter(x => x.id !== md.editId); S.ui.modal = null; renderLayer(); persist("matches", md.matchId); render(); toast("Scratch deleted"); return;
  }
  if (a === "scr-save") {
    const md = S.ui.modal, m = S.matches[md.matchId]; if (m?.locked) { S.ui.modal = null; renderLayer(); render(); toast("This match was locked, so the scratch wasn't saved."); return; } if (!m || !S.canWrite) return;
    if (md.editId) {
      const x = (m.scratches || []).find(y => y.id === md.editId);
      if (x) Object.assign(x, { player: md.player, type: md.type, game: md.game, edited: Date.now() });
      m.names ||= {}; m.names[md.player] = pName(m.seasonId, md.player, m);
      S.ui.modal = null; S.ui.armed = null; renderLayer(); persist("matches", md.matchId); render(); toast("Scratch updated"); return;
    }
    (m.scratches ||= []).push({ id: uid(), player: md.player, type: md.type, game: md.game, at: Date.now() });
    m.names ||= {}; m.names[md.player] = pName(m.seasonId, md.player, m);
    const nth = m.scratches.filter(x => x.game === md.game && x.player === md.player).length;
    const msg = `${scrLabel(md.type)} logged for ${pName(m.seasonId, md.player, m)}${nth > 1 ? ` (${ord(nth)} this game)` : ""}`;
    persist("matches", md.matchId); render();
    if (b.dataset.more) { md.type = ""; md.logged = (md.logged || 0) + 1; renderLayer(); toast(msg); return; }
    S.ui.modal = null; renderLayer(); toast(msg); return;
  }
  if (a === "rm-scratch") { const m = S.matches[b.dataset.m]; if (!m || m.locked || !S.canWrite) return; m.scratches = (m.scratches || []).filter(x => x.id !== b.dataset.id); persist("matches", b.dataset.m); render(); toast("Scratch removed"); return; }
  if (a === "close-modal") { if (e.target !== b) return; S.ui.modal = null; renderLayer(); return; }
  if (a === "tab") { S.view.tab = b.dataset.v; S.view.matchId = null; S.ui.armed = null; S.ui.unlock = null; render(); window.scrollTo(0, 0); return; }
  if (a === "open") { S.view.matchId = b.dataset.id; render(); window.scrollTo(0, 0); return; }
  if (a === "back") { S.view.matchId = null; S.ui.unlock = null; S.ui.relineup = null; render(); return; }
  if (a === "toggle-season") { const id = b.dataset.id, open = S.ui.openSeason === id || (S.ui.openSeason == null && id === curSeasonId()); S.ui.openSeason = open ? "" : id; render(); return; }
  if (a === "note") { S.ui.modal = { matchId: S.view.matchId, g: b.dataset.g === "match" ? "match" : g }; renderLayer(); return; }
  if (!S.canWrite) return;
  if (a === "save-note") { const v = $("#modal-text").value.trim(), md = S.ui.modal; S.ui.modal = null; renderLayer(); editMatch(m => { if (md.g === "match") m.comment = v; else m.games[md.g].comment = v; }); return; }
  if ((a === "add-sub" || a === "rm-sub") && S.matches[S.view.matchId]?.lineupFinal) { toast("The lineup is final. Tap Edit lineup to change it."); return; }
  if (a === "add-sub") {
    const inp = $("#sub-name"), name = inp?.value.trim(); if (!name) { inp?.focus(); return; }
    editMatch(m => { const id = "sub-" + uid(); (m.subs ||= []).push({ id, name }); m.roster = [...(m.roster || []), id]; });
    setTimeout(() => $("#sub-name")?.focus(), 0); return;
  }
  if (a === "rm-sub") { const id = b.dataset.id; editMatch(m => { m.subs = (m.subs || []).filter(x => x.id !== id); m.roster = (m.roster || []).filter(x => x !== id); m.games.forEach(gm => { gm.p = gm.p.map(x => x === id ? "" : x); }); }); return; }
  if (a === "lineup-final") {
    const m = S.matches[S.view.matchId]; if (!m || m.locked || m.lineupFinal) return;
    const chk = check(m);
    if (chk.errs.length) { toast("Fix the lineup problems shown above before finalizing."); return; }
    const n = (m.roster || []).length, need = n === 4 ? 4 : GAMES;
    if (n < 4 || m.games.slice(0, need).some(g => !g.p[0] || !g.p[1])) { toast("Fill every game with two players before finalizing."); return; }
    editMatch(x => { x.lineupFinal = true; x.lineupFinalAt = Date.now(); }); toast("Lineup finalized"); return;
  }
  if (a === "relineup-start") { S.ui.relineup = { id: S.view.matchId, step: 1 }; render(); return; }
  if (a === "relineup-next") { S.ui.relineup = { id: S.view.matchId, step: 2 }; render(); return; }
  if (a === "relineup-cancel") { S.ui.relineup = null; render(); return; }
  if (a === "relineup-confirm") {
    const id = S.view.matchId; if (S.ui.relineup?.id !== id || S.ui.relineup.step !== 2) return;
    S.ui.relineup = null; editMatch(x => { x.lineupFinal = false; delete x.lineupFinalAt; }); toast("Lineup reopened for editing"); return;
  }
  if (a === "lock") { const id = S.view.matchId, m = S.matches[id]; if (!m) return; m.locked = true; m.lockedAt = Date.now(); if (!m.lineupFinal) { m.lineupFinal = true; m.lineupFinalAt = m.lockedAt; } S.ui.relineup = null; S.ui.unlock = null; persist("matches", id); render(); toast("Match locked"); return; }
  if (/^unlock-(start|next|confirm)$/.test(a) && !isAdmin()) return;
  if (a === "unlock-start") { S.ui.unlock = { id: S.view.matchId, step: 1 }; render(); return; }
  if (a === "unlock-next") { S.ui.unlock = { id: S.view.matchId, step: 2 }; render(); return; }
  if (a === "unlock-cancel") { S.ui.unlock = null; render(); return; }
  if (a === "unlock-confirm") { const id = S.view.matchId, m = S.matches[id]; if (!m || S.ui.unlock?.id !== id || S.ui.unlock.step !== 2) return; m.locked = false; delete m.lockedAt; S.ui.unlock = null; persist("matches", id); render(); toast("Match unlocked"); return; }
  if (a === "rules-clear") { S.ui.draft = null; S.ui.armed = null; const f = $("#rules-file"); if (f) f.value = ""; render(); return; }
  if (a === "rules-post" && !canLeague(S.leagueId)) return;
  if (a === "rules-post") {
    const text = (S.ui.draft?.text || "").trim(); if (!text) return;
    if (text.length > 200000) { toast("That's too long to post. Trim it under 200,000 characters."); return; }
    if (S.rules.text && !arm("rules-post")) return;
    S.ui.armed = null; S.rules = { text, fileName: S.ui.draft.fileName || "", updated: Date.now() }; S.ui.draft = null;
    persist("config", "rules"); render(); window.scrollTo(0, 0); toast("Rules posted"); return;
  }
  if (a === "new-match") {
    const id = uid(), sid = curSeasonId();
    S.matches[id] = { seasonId: sid, date: todayISO(), opponent: "", roster: [], games: Array.from({ length: GAMES }, blankGame), comment: "", names: {}, created: Date.now() };
    persist("matches", id); S.view.matchId = id; render(); window.scrollTo(0, 0); return;
  }
  if (a === "del-match") { if (!isAdmin()) return; if (S.matches[S.view.matchId]?.locked) return; if (!arm("del-" + S.view.matchId)) return; const id = S.view.matchId; delete S.matches[id]; persist("matches", id); S.view.matchId = null; S.ui.armed = null; render(); toast("Match deleted"); return; }
  if (a === "result") { editMatch(m => { m.games[g].result = m.games[g].result === b.dataset.v ? "" : b.dataset.v; }); return; }
  if (a === "move") { editLineup(m => { const j = g + +b.dataset.v; [m.games[g], m.games[j]] = [m.games[j], m.games[g]]; }); return; }
  if (a === "all-in" || a === "all-out") { editLineup(m => { m.roster = a === "all-in" ? activePlayers(S.seasons[m.seasonId]).map(p => p.id) : []; }); return; }
  if (a === "shuffle") {
    const m = S.matches[S.view.matchId]; if (m.locked || m.lineupFinal) return; const filled = m.games.some(x => x.result || x.p[0] || x.p[1]);
    if (filled && !arm("shuffle-" + S.view.matchId)) return;
    S.ui.armed = null;
    const games = randomLineup(m); if (!games) { toast(m.roster?.length < 4 ? "Need at least 4 players present to build a lineup." : "Couldn't find a lineup that fits the rules. Check who's present."); render(); return; }
    editMatch(x => { x.games = games; }); toast("Pairings drawn"); return;
  }
  if (a === "copy-roster") {
    const from = S.seasons[b.dataset.from]; if (!from) return;
    editSeason(b.dataset.id, s => { s.players = activePlayers(from).slice(0, MAX_ROSTER).map(p => ({ id: p.id, name: p.name })); });
    toast(`Copied ${activePlayers(S.seasons[b.dataset.id]).length} players`); return;
  }
  if (a === "add-player") {
    const inp = $("#np-" + b.dataset.id), name = inp.value.trim(); if (!name) { inp.focus(); return; }
    if (activePlayers(S.seasons[b.dataset.id]).length >= MAX_ROSTER) { toast(`Rosters max out at ${MAX_ROSTER} players (rule II.A).`); return; }
    inp.value = ""; editSeason(b.dataset.id, s => { (s.players ||= []).push({ id: uid(), name }); }); setTimeout(() => $("#np-" + b.dataset.id)?.focus(), 0); return;
  }
  if (a === "rm-player") { if (!arm("p-" + b.dataset.p)) return; S.ui.armed = null; editSeason(b.dataset.id, s => { const p = s.players.find(x => x.id === b.dataset.p); if (p) p.removed = true; }); return; }
  if (a === "restore-player") { if (activePlayers(S.seasons[b.dataset.id]).length >= MAX_ROSTER) { toast(`Rosters max out at ${MAX_ROSTER} players (rule II.A).`); return; } editSeason(b.dataset.id, s => { const p = s.players.find(x => x.id === b.dataset.p); if (p) delete p.removed; }); return; }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "rules-file" && t.files?.[0]) { readRulesFile(t.files[0]); return; }
  if (t.id === "season-pick") { S.view.seasonId = t.value; S.view.matchId = null; try { localStorage.setItem("ss-season-" + S.teamId, t.value); } catch (x) {} render(); return; }
  if (t.id === "team-pick") { try { localStorage.setItem("ss-admin-team", t.value); } catch (x) {} loadTeam(t.value); return; }
  if (t.dataset.act === "adm-role") { changeAdminRole(t); return; }
  if (t.id === "gate-team") { S.gate.teamId = t.value; return; }
  if (t.id === "gate-league") { S.gate.leagueId = t.value; S.gate.teamId = ""; try { localStorage.setItem("ss-last-league", t.value); } catch (x) {} refreshGateTeams().then(render); return; }
  if (t.id === "mgr-league") { S.mgr.leagueId = t.value; S.mgr.seasonId = null; S.mgr.data = null; render(); return; }
  if (!S.canWrite) return;
  if (t.dataset.act === "player") { editLineup(m => { m.games[+t.dataset.g].p[+t.dataset.s] = t.value; m.names ||= {}; if (t.value) m.names[t.value] = pName(m.seasonId, t.value, m); }); return; }
  if (t.dataset.act === "roster") { editLineup(m => { const id = t.dataset.id; m.roster = t.checked ? [...new Set([...(m.roster || []), id])] : (m.roster || []).filter(x => x !== id); }); return; }
  if (t.dataset.act === "mtype") { editMatch(m => { m.playoff = t.value === "playoff"; }); return; }
  if (t.dataset.act === "forfeit") { editMatch(m => { m.forfeit = t.value; }); return; }
  if (t.dataset.field === "date") { editMatch(m => { m.date = t.value; }); return; }
});

document.addEventListener("input", e => {
  const t = e.target, f = t.dataset.field; if (!f || !S.canWrite) return;
  if (f === "league-name") { saveLeagueName(t.value); return; }
  if (f === "rules-q") { S.ui.rulesQ = t.value; clearTimeout(window._rq); window._rq = setTimeout(updateRulesResults, 120); return; }
  if (f === "rules-draft") { S.ui.draft = { text: t.value, fileName: S.ui.draft?.fileName || "" }; const btn = $('[data-act="rules-post"]'); if (btn) btn.disabled = !t.value.trim(); return; }
  if ((f === "opponent" || f === "opp") && S.matches[S.view.matchId]?.locked) return;
  if (f === "opponent") { const m = S.matches[S.view.matchId]; m.opponent = t.value; persist("matches", S.view.matchId); }
  else if (f === "opp") { const m = S.matches[S.view.matchId], gm = m.games[+t.dataset.g]; (gm.opp ||= ["", ""])[+t.dataset.s] = t.value; persist("matches", S.view.matchId); }
  else if (f === "team-name") { S.team.name = t.value; persist("config", "team"); }
  else if (f === "player-name") { const p = S.seasons[t.dataset.id].players.find(x => x.id === t.dataset.p); if (p) p.name = t.value; persist("seasons", t.dataset.id); }
});
document.addEventListener("focusout", e => { if (e.target.dataset?.field && e.target.type === "text") { clearTimeout(window._fo); window._fo = setTimeout(render, 300); } });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (S.phase === "gate" || S.phase === "recovery")) { const btn = $('[data-act^="gate-"].primary, [data-act="recover-save"]'); if (btn && !btn.disabled) { e.preventDefault(); btn.click(); } return; }
  if (e.key === "Escape" && S.ui.modal) { S.ui.modal = null; renderLayer(); }
  if (e.key === "Enter" && e.target.dataset?.enter === "add-player") $(`[data-act="add-player"][data-id="${e.target.dataset.id}"]`)?.click();
  if (e.key === "Enter" && e.target.dataset?.enter === "season-rename-save") $(`[data-act="season-rename-save"][data-id="${e.target.dataset.id}"]`)?.click();
  if (e.key === "Enter" && e.target.dataset?.enter === "add-sub") $('[data-act="add-sub"]')?.click();
});

function loadScript(src) { return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = no; document.head.append(el); }); }
async function readRulesFile(file) {
  const name = file.name, ext = name.split(".").pop().toLowerCase();
  try {
    let text = "";
    if (ext === "docx") {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
      text = (await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
    } else if (ext === "html" || ext === "htm") {
      const doc = new DOMParser().parseFromString(await file.text(), "text/html");
      doc.querySelectorAll("script,style").forEach(x => x.remove());
      doc.querySelectorAll("p,div,li,h1,h2,h3,h4,br,tr").forEach(x => x.append("\n"));
      text = doc.body.textContent;
    } else if (ext === "pdf") {
      const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
      await loadScript(base + "pdf.min.js"); await loadScript(base + "pdf.worker.min.js");
      const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
      const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const tc = await (await pdf.getPage(i)).getTextContent(); let line = "", out = [], lastY = null;
        for (const it of tc.items) { const y = Math.round(it.transform[5]); if (lastY !== null && Math.abs(y - lastY) > 2) { out.push(line); line = ""; } line += it.str; lastY = y; if (it.hasEOL) { out.push(line); line = ""; lastY = null; } }
        out.push(line); pages.push(out.map(l => l.trim()).join("\n"));
      }
      text = pages.join("\n\n");
    } else if (ext === "doc") {
      toast("Old .doc files can't be read. Save it as .docx and upload again."); return;
    } else text = await file.text();
    text = text.replace(/\r\n?/g, "\n").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
    if (!text) { toast("That file has no readable text."); return; }
    S.ui.draft = { text, fileName: name }; S.ui.armed = null; render(); toast(`Loaded ${name}. Review it, then post.`);
  } catch (e) { toast("Couldn't read that file. Try saving it as .docx or .txt, or paste the text."); }
}

boot();
